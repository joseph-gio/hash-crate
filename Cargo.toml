[package]
name = "hash-crate"
description = "utility for generating deterministic hashes of local crates"
version = "0.0.8"
edition = "2024"
rust-version = "1.88.0"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Joseph Giordano <21144246+joseph-gio@users.noreply.github.com>"]
repository = "https://github.com/joseph-gio/hash-crate"

[dependencies]
blake3 = { version = "1.8.2", features = ["rayon", "mmap"] }
rayon = "1"
walkdir = "2"

argh = "0.1.13"
log = "0.4"
simple_logger = { version = "5", default-features = false, features = [
    "stderr",
] }

[profile.release]
debug = "line-tables-only"
strip = "debuginfo"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
